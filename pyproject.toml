[project]
name = "labcensus"
version = "0.0.1"
description = "Coming soon"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Matthew McCann" }]
dependencies = [
    "fsspec>=2024.2.0",
    "typer>=0.12.0",
    "pydantic>=2.6.0",
    "jinja2>=3.1.0",
]

[project.scripts]
labcensus = "labcensus.cli:app"

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labcensus"]

[tool.hatch.build.targets.sdist]
include = [
    "src/labcensus",
    "tests",
    "docs",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
